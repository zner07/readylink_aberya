<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>READYLINK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="bg"><div class="blob b1"></div><div class="blob b2"></div><svg id="cont" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice"></svg></div>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>

<script src="js/utils.js"></script>
<script src="js/data.js"></script>
<script src="js/seed-data.js"></script>
<script src="js/demo-insights.js"></script>
<script src="js/map-data.js"></script>
<script src="js/map.js"></script>
<script src="js/heatmap.js"></script>
<script src="js/illustrations.js"></script>
<script src="js/config.js"></script>
<script src="js/api-server.js"></script>
<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/connection.js"></script>
<script src="js/shells.js"></script>
<script src="js/pages-public.js"></script>
<script src="js/pages-admin.js"></script>
<script src="js/router.js"></script>
<script src="js/events.js"></script>
<script>
/* Safety net: if index.html is opened on its own (for example straight from inside a .zip),
   the css/ and js/ files are missing and the page would be blank. Show a clear message instead. */
(function(){
  var cssOk=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()!=='';
  var jsOk=typeof render==='function';
  if(cssOk&&jsOk)return;
  document.body.innerHTML='<div style="font:16px/1.6 system-ui,sans-serif;max-width:560px;margin:12vh auto;padding:0 24px;color:#0F1D26">'
    +'<h1 style="font-size:28px;margin:0 0 12px">READYLINK could not load its files</h1>'
    +'<p>index.html needs the <b>css</b> and <b>js</b> folders next to it.</p>'
    +'<p>If you opened it from inside the .zip: close this tab, right-click the zip, choose <b>Extract All</b>, then open <b>index.html</b> from the extracted folder.</p>'
    +'<p style="color:#44565F">Kung galing sa loob ng zip ang pagbukas: i-right-click ang zip, piliin ang <b>Extract All</b>, tapos buksan ang index.html sa bagong folder.</p></div>';
})();
</script>
</body>
</html>
